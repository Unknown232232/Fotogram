<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Fotogram zeigt Ihr persönliches Fotoalbum mit einer Galerie und einer Großansicht der Fotos an."
        />
        <title>Fotogram – Dein persönliches Fotoalbum</title>
        <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />

        <script defer src="js/photos.js"></script>
        <script defer src="js/templates.js"></script>
        <script defer src="js/gallery.js"></script>
        <script defer src="js/script.js"></script>

        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body onload="init()">
        <header class="page_header">
            <div class="page_header_inner">
                <a class="logo_link" href="index.html">
                    <img
                        class="page_logo"
                        src="assets/icons/Capa_1.png"
                        alt="Fotogram, Zurück zur Startseite"
                    />
                </a>
            </div>
        </header>

        <main class="page_main">
            <section class="photo_section">
                <h1 class="page_title">Dein persönliches Fotoalbum</h1>
                <ul class="gallery" id="gallery" aria-label="Fotogalerie"></ul>
            </section>
        </main>

        <dialog
            class="photo_dialog"
            id="photo-dialog"
            aria-labelledby="dialog-title"
        ></dialog>

        <footer class="page_footer">
            <img
                class="footer_logo"
                src="assets/icons/Logo.png"
                alt="Developer Akademie"
            />
            <p class="footer_text">© 2023 Developer Akademie GmbH</p>
        </footer>

        <script src="js/photos.js"></script>
        <script src="js/templates.js"></script>
        <script src="js/gallery.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
