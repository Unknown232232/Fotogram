<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Fotogram shows your personal photo album with a gallery and a large photo view."
        />
        <title>Fotogram – Dein persönliches Fotoalbum</title>
        <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>
        <header class="page_header">
            <div class="page_header_inner">
                <a class="logo_link" href="index.html">
                    <img
                        class="page_logo"
                        src="assets/icons/Capa_1.png"
                        alt="Fotogram, back to start page"
                    />
                </a>
            </div>
        </header>

        <main class="page_main">
            <section class="photo_section">
                <h1 class="page_title">Dein persönliches Fotoalbum</h1>
                <ul
                    class="gallery"
                    id="gallery"
                    aria-label="Photo gallery"
                ></ul>
            </section>
        </main>

        <dialog
            class="photo_dialog"
            id="photo-dialog"
            aria-labelledby="dialog-title"
        ></dialog>

        <footer class="page_footer">
            <img
                class="footer_logo"
                src="assets/icons/Logo.png"
                alt="Developer Akademie"
            />
            <p class="footer_text">© 2023 Developer Akademie GmbH</p>
        </footer>

        <script src="js/photos.js"></script>
        <script src="js/templates.js"></script>
        <script src="js/gallery.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
